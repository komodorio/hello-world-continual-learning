id: missing-feature
input: |
  Customer message:
  Hey, Priya here. I'm hosting brunch on Sunday and I'm out of beans. If I order now (it's
  Friday afternoon) can you deliver on Sunday morning? Happy to pay extra for a Sunday slot.

  Policy snippet:
  Delivery. We ship Monday to Saturday. Orders placed before 14:00 on a shipping day leave the
  roastery the same day; later orders leave the next shipping day. Standard delivery takes 1-2
  shipping days. Express delivery (next shipping day, ordered before 14:00) is available for
  an extra fee. We do not ship or deliver on Sundays or public holidays. Same-day pickup from
  the roastery is available Monday to Saturday, 9:00-17:00.

expected: |
  Must say:
  - No, we do not deliver on Sundays (no paid Sunday slot exists either).
  - A concrete nearest option: express delivery for Saturday only works if ordered before 14:00 on a shipping day (Friday afternoon is past the cutoff, so the order leaves Saturday and arrives Monday-Tuesday), so the realistic option is same-day pickup from the roastery on Saturday 9:00-17:00.
  Must not:
  - Invent a Sunday delivery, a weekend courier, or a paid Sunday option.
  - Claim Saturday delivery is possible for an order placed Friday afternoon.
  Must answer:
  - Whether Sunday delivery is possible.
