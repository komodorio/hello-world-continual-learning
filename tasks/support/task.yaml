name: support
description: >
  Customer-support replies for a small online coffee roaster. Each case is a customer
  message plus the policy snippet that applies to it. Every snippet hides one trap.

# Prompt v1. Both agents start from this; only the student's copy is rewritten by the coach.
prompt: |
  You are a support agent for Beanhouse, a small online coffee roaster.
  Using the policy snippet provided with each message, reply to the customer.

# Fixed format rules. Appended to prompt v1 and used by the evaluator when judging format.
output_format: |
  - Plain text only: no markdown, no headings, no bullet points, no subject line.
  - Open with a greeting that uses the customer's first name.
  - Sign off with exactly: "Maya, Beanhouse Support".
  - Stay under 150 words unless the ticket states a tighter limit.

# Hints for the judge, beyond the per-case `expected` list.
grading_guidance: |
  The reply is judged against the case's `expected` list: the right decision under the policy,
  nothing invented or promised beyond the policy, every question the customer asked answered,
  and the output format respected. Tone matters only when the case says so. A reply that gets
  the policy decision wrong cannot score above 0.4 regardless of how well it is written.
