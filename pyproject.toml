[project]
name = "prompt-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "itiel", email = "itielshw@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "google-adk",
    "litellm",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "rich",
    "typer",
    "uvicorn",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
